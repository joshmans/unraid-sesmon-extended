# Releases are made by bumping the top heading of CHANGELOG.md in a PR.
# The shared workflow (joshmans/unraid-tools) tests, builds, publishes the GitHub
# release and stamps sesmon-ext.plg with the package's SHA-256.
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: joshmans/unraid-tools/.github/workflows/plugin-release.yml@main
    with:
      plg: sesmon-ext.plg
      # the plugin's PHP files open with the short tag, which Unraid's PHP enables and a stock runner's does not
      test-command: mkdir -p /tmp/phpini && echo short_open_tag=1 > /tmp/phpini/short.ini && PHP_INI_SCAN_DIR=:/tmp/phpini tests/run.sh
      package-dir: dist
      publish: ${{ github.event_name != 'pull_request' }}
