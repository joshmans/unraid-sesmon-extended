# sesmon configuration for sesmon-ext
#
# Nothing is monitored yet. Open Settings > SCSI Enclosure Monitor > Enclosures, tick the
# enclosures to monitor and save: this file is then written for you. You can also edit it
# by hand (see the sesmon documentation linked on that page for every setting).

# Keep this true on Unraid: the syslog adds its own timestamps
disable_timestamps: true

# Devices to monitor (empty until you choose some)
devices: []
